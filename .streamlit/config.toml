# 센터 PC 데이터 경계: 사용 통계 전송을 끄고 이 PC에서만 접속한다.
[browser]
gatherUsageStats = false
serverAddress = "localhost"

[server]
address = "localhost"
headless = true

[client]
toolbarMode = "minimal"

# 제주한눈 다크 네이비 테마. 강조색(감귤 오렌지)은 상태 배지에만 쓴다. 세부 스타일은 app/brand.py.
[theme]
base = "light"
primaryColor = "#0F1B2D"
backgroundColor = "#F5F8FC"
secondaryBackgroundColor = "#EEF5FF"
textColor = "#0F172A"
linkColor = "#0F1B2D"
borderColor = "#DCE5F0"
baseRadius = "0.625rem"
font = "Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif"
metricValueFontSize = "1.6rem"
blueColor = "#0369A1"
orangeColor = "#C2410C"
grayColor = "#475569"
violetColor = "#1E2F4A"
chartCategoricalColors = ["#0F1B2D", "#38BDF8", "#FF7A00", "#64748B"]

[theme.sidebar]
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F5F8FC"
